name: tests

# Phase 0 deliberately depends on numpy, pandas and matplotlib only, so CI stays
# fast and green from day one. Heavier dependencies get added to this workflow as
# the phases that need them land.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24" "pandas>=2.0" "matplotlib>=3.7" \
                      "scikit-learn>=1.3" "pytest>=7.4"

      - name: Run tests
        run: pytest -q

      # Figures 1-4 are built from committed data, so CI can regenerate them and
      # check they still match. Figures 5-6 depend on data/cache/, which is
      # gitignored (85 MB of graphs), so they cannot be rebuilt here -- checking
      # them would just fail on every clean checkout for the wrong reason.
      - name: Rebuild the figures that need no cache
        run: python scripts/make_figures.py --only 1 --only 2 --only 3 --only 4

      - name: Fail if a committed figure is stale
        run: |
          if ! git diff --quiet -- results/figures/fig1_polymorph_problem.png \
                                   results/figures/fig2_crystal_to_graph.png \
                                   results/figures/fig3_data_provenance.png \
                                   results/figures/fig4_roadmap.png; then
            echo "::error::Committed figures differ from what the scripts produce."
            echo "Run 'python scripts/make_figures.py' and commit the result."
            git diff --stat -- results/figures/
            exit 1
          fi
          echo "Committed figures match their source scripts."
